#
# Builds the APK of The Forge for the Fire tablet (or any Android device) on
# GitHub's own computers. It runs by itself every time something is uploaded
# (committed) to the repository, and can also be started by hand from the
# Actions tab ("Build The Forge APK", then "Run workflow").
#
# When it finishes, the APK is in two places:
#   1. The Releases page of the repository, as the-forge.apk. This is the one
#      to use on the tablet.
#   2. The run's own page, under "Artifacts", as a zip (needs a computer).
#
# Made by The Forge from the recipe that builds Carpe Diem for the Fire tablet.

name: Build The Forge APK

on:
  push:
    # an iPhone and iPad project kept in the same repository builds on its own
    paths-ignore:
      - 'iphone-ipad/**'
      - '.github/workflows/build-ipa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Get the project
        uses: actions/checkout@v4

      - name: Find the Gradle project
        # Works whether the project was uploaded at the top of the repository
        # or inside a folder.
        run: |
          F=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$F" ]; then
            echo "No settings.gradle found. Upload the CONTENTS of the Fire tablet project folder."
            exit 1
          fi
          D=$(dirname "$F")
          echo "Project folder: $D"
          echo "PROJ=$D" >> "$GITHUB_ENV"

      - name: Prepare Java and the Android tools
        run: |
          # Java 17 is already on GitHub's computers.
          echo "JAVA_HOME=${JAVA_HOME_17_X64:-$JAVA_HOME}" >> "$GITHUB_ENV"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null
            "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null
            echo "Android tools ready in $SDK"
          else
            echo "sdkmanager not found; the Android plugin will fetch what it needs."
          fi

      - name: Get Gradle 8.7
        # Pinned on purpose: a newer Gradle cannot run this project's Android
        # plugin, and a run that relied on whatever Gradle the computer had
        # could break without any change on our side.
        run: |
          curl -sSL --retry 4 -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: The signing key (from this repository's secrets, never from its files)
        # With the secret ANDROID_SIGNING_PASSPHRASE, signing/the-forge-signing-2026.gpg opens and the app is signed through
        # the signing lineage (signing/lineage-2026.bin): the old key vouches for the new one, so the Forge on a tablet updates
        # in place, and from then on an app signed with the old key alone no longer installs over it.
        # Without the secret, the app is signed with the old key, the one the Forge on the tablet already has, so it still
        # installs as an update. The old key is read from this repository's history (the commit that first kept it), never
        # written into its files. See signing/SIGNING.txt.
        env:
          SIGN_PASS: ${{ secrets.ANDROID_SIGNING_PASSPHRASE }}
        run: |
          cd "$PROJ"
          mkdir -p signing
          S="$RUNNER_TEMP/forge-signing"; mkdir -p -m 700 "$S"
          if [ -z "$SIGN_PASS" ] || [ ! -f signing/the-forge-signing-2026.gpg ]; then
            OLD=d085ce9399000044501d3a20b9332e246b1dfc52
            git fetch --no-tags --depth 1 origin "$OLD" > /dev/null 2>&1 \
              || { echo "::error::The old signing key could not be read from the repository's history, and the secret ANDROID_SIGNING_PASSPHRASE is not set. Add the secret (signing/SIGNING.txt) and run this again."; exit 1; }
            git show "$OLD:signing/app.keystore" > "$S/old.keystore"
            OLDPW=$(git show "$OLD:signing/signing.properties" | sed -n 's/^storePassword=//p' | tr -d '\r')
            echo "::add-mask::$OLDPW"
            {
              echo "FORGE_SIGN_MODE=old"
              echo "FORGE_OLD_KEYSTORE=$S/old.keystore"
              echo "FORGE_OLD_KEY_PASS=$OLDPW"
            } >> "$GITHUB_ENV"
            echo "::warning::The secret ANDROID_SIGNING_PASSPHRASE is not set, so this build is signed with the Forge's old key (the one the app on the tablet already has) and installs over it as an update. Add the secret (signing/SIGNING.txt) to move the app to its new key."
            exit 0
          fi
          export GNUPGHOME="$S/gnupg"; mkdir -p -m 700 "$GNUPGHOME"
          printf '%s' "$SIGN_PASS" | gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 0 \
            --decrypt signing/the-forge-signing-2026.gpg | tar -x -C "$S" \
            || { echo "::error::ANDROID_SIGNING_PASSPHRASE does not open signing/the-forge-signing-2026.gpg."; exit 1; }
          NEWPW=$(cat "$S/new.pw"); OLDPW=$(cat "$S/old.pw")
          echo "::add-mask::$NEWPW"; echo "::add-mask::$OLDPW"
          cp "$S/the-forge-release-2026.p12" signing/release.keystore
          {
            echo "ANDROID_KEYSTORE_PASSWORD=$NEWPW"
            echo "ANDROID_KEY_ALIAS=$(cat "$S/alias")"
            echo "FORGE_OLD_KEYSTORE=$S/old.keystore"
            echo "FORGE_OLD_KEY_PASS=$OLDPW"
            echo "FORGE_LINEAGE=$GITHUB_WORKSPACE/$PROJ/signing/lineage-2026.bin"
            echo "FORGE_SIGN_MODE=lineage"
          } >> "$GITHUB_ENV"
          echo "The Forge's key (25 October 2026) is ready, handed over from the old key by the signing lineage."

      - name: Build the APK
        run: |
          cd "$PROJ"
          set -o pipefail
          gradle --no-daemon :app:assembleRelease 2>&1 | tee "$RUNNER_TEMP/build-log.txt"
          # 647: signed again through the lineage: the old key for Android 5 to 8 (APK Signature Schemes 1 and 2) and the new
          # key, vouched for by the old one, for Android 9 and newer (Scheme 3). Passwords from the environment only.
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/aligned.apk"
          if [ "$FORGE_SIGN_MODE" = lineage ]; then
            "$BT/apksigner" sign --ks "$FORGE_OLD_KEYSTORE" --ks-key-alias app --ks-pass env:FORGE_OLD_KEY_PASS --key-pass env:FORGE_OLD_KEY_PASS \
              --next-signer --ks signing/release.keystore --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEYSTORE_PASSWORD \
              --lineage "$FORGE_LINEAGE" --rotation-min-sdk-version 28 --out "$GITHUB_WORKSPACE/the-forge.apk" "$RUNNER_TEMP/aligned.apk"
          else
            "$BT/apksigner" sign --ks "$FORGE_OLD_KEYSTORE" --ks-key-alias app --ks-pass env:FORGE_OLD_KEY_PASS --key-pass env:FORGE_OLD_KEY_PASS \
              --out "$GITHUB_WORKSPACE/the-forge.apk" "$RUNNER_TEMP/aligned.apk"
          fi
          "$BT/apksigner" verify --min-sdk-version 22 --print-certs "$GITHUB_WORKSPACE/the-forge.apk" | grep -E "Signer|SHA-256" | head -6
          ls -la "$GITHUB_WORKSPACE/the-forge.apk"

      - name: Forget the signing keys (nothing after this step can read them)
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/forge-signing" "$PROJ/signing/release.keystore"
          {
            echo "ANDROID_KEYSTORE_PASSWORD="
            echo "FORGE_OLD_KEY_PASS="
            echo "FORGE_OLD_KEYSTORE="
            echo "FORGE_LINEAGE="
          } >> "$GITHUB_ENV"
          echo "The signing keys are gone from this runner."

      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: An update, as on the tablet (the APK on the Releases page first, then this one over it)
        # 647: the Forge already on a tablet was signed with the old key. The new APK must install over it as an update,
        # keeping what the app stored; an APK signed with the old key alone must then be refused.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download the-forge-apk -R "$GITHUB_REPOSITORY" -p the-forge.apk -D "$RUNNER_TEMP/prev" --clobber || echo "no earlier APK on the Releases page"
          ls -la "$RUNNER_TEMP/prev" 2>/dev/null || true

      - name: Install the earlier APK, then this one over it, on an Android emulator
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/update_check.sh "${{ runner.temp }}/prev/the-forge.apk" "${{ github.workspace }}/the-forge.apk" "${{ env.FORGE_SIGN_MODE }}"

      - name: If the build failed, show why
        if: failure()
        run: |
          echo "Last 60 lines of the build log:"
          tail -n 60 "$RUNNER_TEMP/build-log.txt" || echo "(no build log was written)"

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: the-forge-apk
          path: the-forge.apk
          if-no-files-found: error

      - name: Put the APK on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG=the-forge-apk
          PASS=$(grep -m1 '^Pass:' "$PROJ/BUILD_INFO.txt" | tr -dc '0-9' || true)
          NOTES="The Forge for Fire tablet, build ${PASS}. Built $(date -u '+%d %B %Y, %H:%M UTC') from branch ${GITHUB_REF_NAME}, commit ${GITHUB_SHA:0:7}.
          On the tablet: tap the-forge.apk below, then open it from Downloads to install.
          Each new build installs over the old one and keeps your work."
          # Every branch builds, and all of them publish to this one release. A build older than the one already
          # published is kept with its run (Artifacts) but never replaces the newer APK on the Releases page.
          CUR=$(gh release view "$TAG" --json body -q .body 2>/dev/null | grep -o 'build [0-9]\+' | head -n 1 | tr -dc '0-9' || true)
          if [ -n "$CUR" ] && [ -n "$PASS" ] && [ "$PASS" -lt "$CUR" ]; then
            echo "::warning::The Releases page already has The Forge $CUR, newer than this build ($PASS). It stays there; this APK is kept with this run only."
            exit 0
          fi
          # GitHub's upload server sometimes answers with an error of its own
          # (HTTP 500), and a later try goes through. Four tries, further apart.
          publish() {
            if gh release view "$TAG" > /dev/null 2>&1; then
              gh release upload "$TAG" the-forge.apk --clobber
            else
              gh release create "$TAG" the-forge.apk --target "$GITHUB_SHA" \
                --title "The Forge for Fire tablet" --notes "$NOTES"
            fi
          }
          OK=0
          for WAIT in 0 15 30 60; do
            if [ "$WAIT" -gt 0 ]; then echo "GitHub did not accept it; trying again in $WAIT seconds."; sleep "$WAIT"; fi
            if publish; then OK=1; break; fi
          done
          if [ "$OK" != 1 ]; then echo "::error::GitHub did not accept the-forge.apk after four tries. Run the workflow again later. If an error above says 403 or 'Resource not accessible': Settings, Actions, General, Workflow permissions: Read and write."; exit 1; fi
          gh release edit "$TAG" --notes "$NOTES" || echo "The release notes could not be updated; the app is in place."
