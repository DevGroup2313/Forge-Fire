apply plugin: 'com.android.application'

// ONE PERMANENT KEY. Android installs a new APK over the old one only when both
// carry the same signature; otherwise the tablet says "App not installed" and the
// only way past is to uninstall, which deletes everything saved in the app. So
// every build is signed with one key. 644: it is kept in the repository's secrets,
// never in its files (see README.txt). Until it is there, the old key in the folder
// "signing", or Carpe Diem's earlier key (app/carpe-diem.keystore), is used.
def keyProps = new Properties()
def keyInfo = rootProject.file('signing/signing.properties')
if (keyInfo.exists()) { keyInfo.withInputStream { keyProps.load(it) } }
def keyStore = null
if (keyProps.getProperty('storeFile')) { keyStore = rootProject.file('signing/' + keyProps.getProperty('storeFile')) }
if ((keyStore == null || !keyStore.exists()) && file('carpe-diem.keystore').exists()) {
    keyStore = file('carpe-diem.keystore')
    keyProps.setProperty('storePassword', 'carpediem')
    keyProps.setProperty('keyAlias', 'carpediem')
    keyProps.setProperty('keyPassword', 'carpediem')
}
// 644: the key from the repository's secrets comes first (the workflow puts it in place as signing/release.keystore, its
// password only in the environment); the files above only until it is there.
def secretKey = rootProject.file('signing/release.keystore')
if (secretKey.exists() && System.getenv('ANDROID_KEYSTORE_PASSWORD')) {
    keyStore = secretKey
    keyProps.setProperty('storePassword', System.getenv('ANDROID_KEYSTORE_PASSWORD'))
    keyProps.setProperty('keyAlias', System.getenv('ANDROID_KEY_ALIAS') ?: 'app')
    keyProps.setProperty('keyPassword', System.getenv('ANDROID_KEYSTORE_PASSWORD'))
}
def haveKey = keyStore != null && keyStore.exists()

android {
    namespace 'com.yannie.carpediem'
    compileSdk 34
    defaultConfig {
        applicationId 'com.yannieforest.theforge'
        minSdk 22
        targetSdk 34
        // The version number rises by itself with every build: it is the
        // number of minutes since 1 January 2025. Android refuses to install
        // an older number over a newer one, so a fixed number would block
        // updates, and this one never goes backwards, whichever repository
        // or computer builds it.
        versionCode ((int) ((System.currentTimeMillis() - 1735689600000L) / 60000L))
        versionName '643'
    }

    if (haveKey) {
        signingConfigs {
            permanent {
                storeFile keyStore
                storePassword keyProps.getProperty('storePassword')
                keyAlias keyProps.getProperty('keyAlias')
                keyPassword keyProps.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        debug {
            if (haveKey) { signingConfig signingConfigs.permanent }
        }
        release {
            minifyEnabled false
            // Without the permanent key the APK is still made, signed with this
            // computer's own debug key; it installs, but the next one will not
            // install over it. The workflow makes the key before this runs.
            if (haveKey) { signingConfig signingConfigs.permanent } else { signingConfig signingConfigs.debug }
        }
    }

    // Stated outright rather than left to a default. Without this the plugin
    // compiles for Java 8 and warns, and on some toolchains the warning is
    // promoted to an error.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // A lint complaint must never be the reason there is no app to install.
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
dependencies { implementation 'androidx.webkit:webkit:1.8.0' }
