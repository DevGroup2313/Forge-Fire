apply plugin: 'com.android.application'

// ONE KEY. Android installs a new APK over the old one only when it is signed by the same key, or by a new key the old one
// has vouched for; otherwise the tablet says "App not installed" and the only way past is to uninstall, which deletes
// everything saved in the app. 647: the key lives in the encrypted signing/the-forge-signing-2026.gpg, opened by the build with
// the secret ANDROID_SIGNING_PASSPHRASE, which puts it in place as signing/release.keystore (its password only in the
// environment); the workflow then signs the APK again through the signing lineage (signing/SIGNING.txt). No key is ever kept in
// this repository's files.
def keyProps = new Properties()
def keyStore = null
def secretKey = rootProject.file('signing/release.keystore')
if (secretKey.exists() && System.getenv('ANDROID_KEYSTORE_PASSWORD')) {
    keyStore = secretKey
    keyProps.setProperty('storePassword', System.getenv('ANDROID_KEYSTORE_PASSWORD'))
    keyProps.setProperty('keyAlias', System.getenv('ANDROID_KEY_ALIAS') ?: 'forge')
    keyProps.setProperty('keyPassword', System.getenv('ANDROID_KEYSTORE_PASSWORD'))
}
def haveKey = keyStore != null && keyStore.exists()

android {
    namespace 'com.yannie.carpediem'
    compileSdk 34
    defaultConfig {
        applicationId 'com.yannieforest.theforge'
        minSdk 22
        targetSdk 34
        // The version number rises by itself with every build: it is the
        // number of minutes since 1 January 2025. Android refuses to install
        // an older number over a newer one, so a fixed number would block
        // updates, and this one never goes backwards, whichever repository
        // or computer builds it.
        versionCode ((int) ((System.currentTimeMillis() - 1735689600000L) / 60000L))
        versionName '649'
    }

    if (haveKey) {
        signingConfigs {
            permanent {
                storeFile keyStore
                storePassword keyProps.getProperty('storePassword')
                keyAlias keyProps.getProperty('keyAlias')
                keyPassword keyProps.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        debug {
            if (haveKey) { signingConfig signingConfigs.permanent }
        }
        release {
            minifyEnabled false
            // Without the permanent key the APK is still made, signed with this
            // computer's own debug key; it installs, but the next one will not
            // install over it. The workflow makes the key before this runs.
            if (haveKey) { signingConfig signingConfigs.permanent } else { signingConfig signingConfigs.debug }
        }
    }

    // Stated outright rather than left to a default. Without this the plugin
    // compiles for Java 8 and warns, and on some toolchains the warning is
    // promoted to an error.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // A lint complaint must never be the reason there is no app to install.
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
dependencies { implementation 'androidx.webkit:webkit:1.8.0' }
