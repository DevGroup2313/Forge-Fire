android.useAndroidX=true
android.nonTransitiveRClass=true

# A cloud runner gives Gradle a small default heap, and the Android plugin
# with a six megabyte asset can exhaust it. A build that dies this way reports
# "Java heap space" or "Metaspace", which reads like a fault in the project and
# is not one.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
